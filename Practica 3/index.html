<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Powers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Selecciona el poder de Mario</h1>

  <div class="main">
    <img id="mario" src="Mario.webp" alt="Mario" class="mario-img">
  </div>

  <div class="buttons">
    <button onclick="cambiarPoder('champiñon')"><img src="Champiñon.webp" alt="Champiñón" class="icono"></button>
    <button onclick="cambiarPoder('fuego')"><img src="Fuego.webp" alt="Fuego" class="icono"></button>
    <button onclick="cambiarPoder('estrella')"><img src="Estrella.webp" alt="Estrella" class="icono"></button>
    <button onclick="cambiarPoder('hielo')"><img src="Hielo.webp" alt="Hielo" class="icono"></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
